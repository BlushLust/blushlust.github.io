name: Daily Blush Lust pin

on:
  schedule:
    - cron: "47 0 * * *"   # every day ~8:47 pm Toronto time (00:47 UTC)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install fonts and packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
          pip install pillow requests
      - name: Make today's dupe (and pin it if Pinterest is connected)
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: python bot/run.py
      - name: Publish to the website
        run: |
          git config user.name "BlushLust"
          git config user.email "BlushLust@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily dupe $(date -u +%F)"
          git push
